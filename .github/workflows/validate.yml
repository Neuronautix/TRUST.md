name: Validate trust.md files

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest

      - name: Validate all examples
        run: |
          python tools/validate.py TRUST.md
          find examples -name '*.trust.md' -print0 | while IFS= read -r -d '' f; do
            echo "--- $f ---"
            python tools/validate.py "$f"
          done

      - name: Run schema and validator tests
        run: python -m pytest -q
